name: Quality Gate

on: 
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Blazor Workload
        run: dotnet workload install wasm-tools

      - name: Install Workloads (Blazor only)
        run: dotnet workload restore UIBlazor/UIBlazor.csproj

      - name: Restore (Only .NET 10 Projects)
        run: |
          dotnet restore UIBlazor/UIBlazor.csproj
          dotnet restore UIBlazor.Tests/UIBlazor.Tests.csproj

      - name: Test & Collect Coverage
        # Белый список: считаем покрытие только продуктивной сборки UI.
        # Новые NuGet-зависимости не попадут в отчет автоматически.
        run: |
          dotnet test --project UIBlazor.Tests/UIBlazor.Tests.csproj -c Release --results-directory TestResults --coverlet --coverlet-output-format cobertura --coverlet-include "[UIBlazor]*"

      - name: Generate Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.2
        with:
          reports: 'TestResults/**/coverage.cobertura.*.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Badges'
          assemblyfilters: '+*;-*.Tests'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coveragereport