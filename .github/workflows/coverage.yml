name: Quality Gate

on: 
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job: a hung child process can never block the gate for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Blazor Workload
        run: dotnet workload install wasm-tools

      - name: Install Workloads (Blazor only)
        run: dotnet workload restore UIBlazor/UIBlazor.csproj

      - name: Restore (Only .NET 10 Projects)
        # NuGetAudit=false: аудит уязвимостей тянет данные с nuget.org на каждом restore.
        # На раннере с медленным/нестабильным egress это главный источник «зависаний в restore»:
        # TCP-соединение к CDN висит в retransmit (cwnd схлопывается в 1) и шаг висит минутами.
        # Аудит не нужен для сборки и покрытия — выключаем, чтобы restore был чисто локальным.
        timeout-minutes: 10
        run: |
          dotnet restore UIBlazor/UIBlazor.csproj -p:NuGetAudit=false
          dotnet restore UIBlazor.Tests/UIBlazor.Tests.csproj -p:NuGetAudit=false
          dotnet restore ToolCore.Tests/ToolCore.Tests.csproj -p:NuGetAudit=false

      - name: Test & Collect Coverage (UIBlazor)
        # Белый список: считаем покрытие только продуктивной сборки UI.
        # Новые NuGet-зависимости не попадут в отчет автоматически.
        timeout-minutes: 15
        run: |
          dotnet test --project UIBlazor.Tests/UIBlazor.Tests.csproj -c Release --no-restore --timeout 10m --show-slowest-tests 10 --results-directory TestResults/UIBlazor --coverlet --coverlet-output-format cobertura --coverlet-include "[UIBlazor]*"

      - name: Build ToolCore.Tests (Release)
        # Сборка вынесена отдельным шагом: если тестовый шаг вдруг долгий, по таймингам видно,
        # что время ушло НЕ на компиляцию. Здесь же собираются TestAssets,
        # включая ASP.NET echo-сервер для HTTP-транспорта.
        timeout-minutes: 10
        run: dotnet build ToolCore.Tests/ToolCore.Tests.csproj -c Release --no-restore

      - name: Test & Collect Coverage (ToolCore, unit only)
        # Два предохранителя сразу:
        #  1) INVAIT_SKIP_INTEGRATION=1 — убирает MCP-тесты с реальными дочерними процессами.
        #  2) --timeout 8m — глобальный лимит самого раннера: зависший тест/хост
        #     будет принудительно прерван (Aborted) через 8 минут, а не через 40.
        # --diagnostic пишет трассировку MTP в артефакт: по ней видно, на чём именно встало.
        timeout-minutes: 12
        env:
          INVAIT_SKIP_INTEGRATION: '1'
        run: |
          dotnet test --project ToolCore.Tests/ToolCore.Tests.csproj -c Release --no-build \
            --timeout 8m --show-slowest-tests 10 \
            --diagnostic --diagnostic-output-directory TestResults/ToolCore/diag \
            --results-directory TestResults/ToolCore \
            --coverlet --coverlet-output-format cobertura --coverlet-include "[ToolCore]*"

      - name: Test MCP integration (ToolCore, bounded)
        # Отдельный шаг с тем же лимитом раннера. Покрытие докладывается в TestResults/Integration
        # и сливается в общий отчет ниже. continue-on-error: эти тесты спавнят реальные процессы
        # и нестабильны на общих раннерах — красный статус quality gate из-за них не нужен.
        timeout-minutes: 10
        continue-on-error: true
        run: |
          dotnet test --project ToolCore.Tests/ToolCore.Tests.csproj -c Release --no-build \
            --timeout 6m --show-slowest-tests 10 \
            --diagnostic --diagnostic-output-directory TestResults/Integration/diag \
            --results-directory TestResults/Integration \
            --coverlet --coverlet-output-format cobertura --coverlet-include "[ToolCore]*"

      - name: Upload ToolCore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcore-diagnostics
          path: |
            TestResults/ToolCore/**
            TestResults/Integration/**
          if-no-files-found: ignore

      - name: Generate Report
        if: always() && hashFiles('TestResults/**/coverage.cobertura.*.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.2
        with:
          reports: 'TestResults/**/coverage.cobertura.*.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Badges'
          assemblyfilters: '+*;-*.Tests'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coveragereport

  vscode_test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: VSCode
        run: npm ci

      - name: Type-check
        working-directory: VSCode
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run Mocha tests with Coverage
        working-directory: VSCode
        run: |
          npm run test:coverage 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee coverage-output.txt

      - name: Publish coverage to Step Summary
        if: always()
        working-directory: VSCode
        run: |
          echo "## VS Code Extension Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-output.txt | grep -A 50 "File" | tail -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-lcov
          path: VSCode/coverage/lcov.info
