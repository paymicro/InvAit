name: Quality Gate

on: 
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job: a hung child process can never block the gate for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Blazor Workload
        run: dotnet workload install wasm-tools

      - name: Install Workloads (Blazor only)
        run: dotnet workload restore UIBlazor/UIBlazor.csproj

      - name: Restore (Only .NET 10 Projects)
        run: |
          dotnet restore UIBlazor/UIBlazor.csproj
          dotnet restore UIBlazor.Tests/UIBlazor.Tests.csproj
          dotnet restore ToolCore.Tests/ToolCore.Tests.csproj

      - name: Test & Collect Coverage (UIBlazor)
        # Белый список: считаем покрытие только продуктивной сборки UI.
        # Новые NuGet-зависимости не попадут в отчет автоматически.
        timeout-minutes: 15
        run: |
          dotnet test --project UIBlazor.Tests/UIBlazor.Tests.csproj -c Release --results-directory TestResults/UIBlazor --coverlet --coverlet-output-format cobertura --coverlet-include "[UIBlazor]*"

      - name: Test & Collect Coverage (ToolCore, unit only)
        # MCP-интеграционные тесты (реальные дочерние процессы: McpHost, stdio/HTTP echo-серверы)
        # вынесены в отдельный шаг ниже: в unit-прогоне они не нужны, а именно они способны
        # подвиснуть на раннере. Отключаются переменной INVAIT_SKIP_INTEGRATION=1.
        timeout-minutes: 15
        env:
          INVAIT_SKIP_INTEGRATION: '1'
        run: |
          dotnet test --project ToolCore.Tests/ToolCore.Tests.csproj -c Release --results-directory TestResults/ToolCore --coverlet --coverlet-output-format cobertura --coverlet-include "[ToolCore]*"

      - name: Test MCP integration (ToolCore, bounded)
        # Отдельный шаг: покрытие сюда же докладывается в TestResults/Integration и
        # подхватывается ReportGenerator ниже. timeout-minutes гарантирует, что зависший
        # MCP-хост/сервер убьёт шаг за минуты, а не за 40 минут.
        # continue-on-error: эти тесты спавнят реальные процессы и исторически нестабильны
        # на общих раннерах — красный статус quality gate из-за них не нужен. Диагностика
        # выкладывается артефактом. Нужен строгий режим — уберите continue-on-error.
        timeout-minutes: 8
        continue-on-error: true
        run: |
          dotnet test --project ToolCore.Tests/ToolCore.Tests.csproj -c Release --results-directory TestResults/Integration --coverlet --coverlet-output-format cobertura --coverlet-include "[ToolCore]*"

      - name: Upload MCP integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcore-mcp-integration-diagnostics
          path: |
            TestResults/Integration/**
            ToolCore.Tests/bin/Release/net10.0/Log/**
          if-no-files-found: ignore

      - name: Generate Report
        if: always() && hashFiles('TestResults/**/coverage.cobertura.*.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.2
        with:
          reports: 'TestResults/**/coverage.cobertura.*.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Badges'
          assemblyfilters: '+*;-*.Tests'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coveragereport

  vscode_test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: VSCode
        run: npm ci

      - name: Type-check
        working-directory: VSCode
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run Mocha tests with Coverage
        working-directory: VSCode
        run: |
          npm run test:coverage 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee coverage-output.txt

      - name: Publish coverage to Step Summary
        if: always()
        working-directory: VSCode
        run: |
          echo "## VS Code Extension Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-output.txt | grep -A 50 "File" | tail -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-lcov
          path: VSCode/coverage/lcov.info
